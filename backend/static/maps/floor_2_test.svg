<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="963" viewBox="0 0 1400 963">
  <title>Second Floor Plan - Hospital</title>

  <!-- ========================================== -->
  <!--  OUTER BOUNDARY                            -->
  <!-- ========================================== -->
  <rect x="25" y="80" width="1340" height="720" fill="none" stroke="black" stroke-width="3"/>

  <!-- ========================================== -->
  <!--  ROW 1: Top rooms (y ~ 80-270)             -->
  <!-- ========================================== -->

  <!-- MEN Restroom -->
  <rect x="25" y="100" width="210" height="170" fill="#CCE5FF" stroke="black" stroke-width="2" id="men_restroom"/>
  <text x="100" y="210" font-size="16" font-family="Arial" text-anchor="middle" font-weight="bold">MEN</text>

  <!-- WOMEN Restroom -->
  <rect x="280" y="100" width="200" height="170" fill="#CCE5FF" stroke="black" stroke-width="2" id="women_restroom"/>
  <text x="380" y="210" font-size="16" font-family="Arial" text-anchor="middle" font-weight="bold">WOMEN</text>

  <!-- DN (Stairs Down) -->
  <rect x="550" y="100" width="100" height="120" fill="#F3E5F5" stroke="black" stroke-width="2" id="staircase_dn"/>
  <text x="600" y="170" font-size="14" font-family="Arial" text-anchor="middle" font-weight="bold">DN</text>

  <!-- UP (Stairs Up) -->
  <rect x="550" y="220" width="100" height="50" fill="#F3E5F5" stroke="black" stroke-width="2" id="staircase_up"/>
  <text x="600" y="250" font-size="14" font-family="Arial" text-anchor="middle" font-weight="bold">UP</text>

  <!-- LOBBY -->
  <rect x="650" y="220" width="120" height="100" fill="#FCE4EC" stroke="black" stroke-width="2" id="lobby"/>
  <text x="710" y="280" font-size="16" font-family="Arial" text-anchor="middle" font-weight="bold">LOBBY</text>

  <!-- NURSES' ROOM (right of lobby) -->
  <rect x="800" y="160" width="170" height="170" fill="#E8F5E9" stroke="black" stroke-width="2" id="nurses_room"/>
  <text x="885" y="240" font-size="13" font-family="Arial" text-anchor="middle" font-weight="bold">NURSES'</text>
  <text x="885" y="260" font-size="13" font-family="Arial" text-anchor="middle" font-weight="bold">ROOM</text>

  <!-- ========================================== -->
  <!--  CORRIDOR (horizontal strip y ~ 270-300)   -->
  <!-- ========================================== -->
  <rect x="25" y="270" width="625" height="30" fill="#FFFDE7" stroke="black" stroke-width="1" id="corridor_main"/>
  <text x="250" y="290" font-size="14" font-family="Arial" text-anchor="middle" font-weight="bold">CORRIDOR</text>

  <!-- ========================================== -->
  <!--  ROW 2: Middle-left rooms (y ~ 300-470)    -->
  <!-- ========================================== -->

  <!-- STERILIZER -->
  <rect x="200" y="300" width="130" height="100" fill="#E8F5E9" stroke="black" stroke-width="2" id="sterilizer"/>
  <text x="265" y="360" font-size="12" font-family="Arial" text-anchor="middle" font-weight="bold">STERILIZER</text>

  <!-- DELIVERY RM -->
  <rect x="25" y="360" width="175" height="110" fill="#E8F5E9" stroke="black" stroke-width="2" id="delivery_rm"/>
  <text x="112" y="420" font-size="12" font-family="Arial" text-anchor="middle" font-weight="bold">DELIVERY RM</text>

  <!-- SCRUB -->
  <rect x="200" y="400" width="130" height="70" fill="#E8F5E9" stroke="black" stroke-width="2" id="scrub"/>
  <text x="265" y="440" font-size="14" font-family="Arial" text-anchor="middle" font-weight="bold">SCRUB</text>

  <!-- PRE-NATAL / LABOUR RM -->
  <rect x="330" y="300" width="220" height="170" fill="#FFF3E0" stroke="black" stroke-width="2" id="prenatal_labour_rm"/>
  <text x="440" y="395" font-size="11" font-family="Arial" text-anchor="middle" font-weight="bold">PRE-NATAL / LABOUR RM</text>

  <!-- ========================================== -->
  <!--  NURSES' STATION (Central, y ~ 370-470)    -->
  <!-- ========================================== -->
  <rect x="620" y="370" width="160" height="100" fill="#FFEBEE" stroke="black" stroke-width="2" id="nurses_station_central"/>
  <text x="700" y="415" font-size="12" font-family="Arial" text-anchor="middle" font-weight="bold">NURSES'</text>
  <text x="700" y="435" font-size="12" font-family="Arial" text-anchor="middle" font-weight="bold">STATION</text>

  <!-- ========================================== -->
  <!--  ROW 3: Middle-bottom (y ~ 470-580)        -->
  <!-- ========================================== -->

  <!-- ASEPTIC -->
  <rect x="280" y="470" width="130" height="110" fill="#E8F5E9" stroke="black" stroke-width="2" id="aseptic"/>
  <text x="345" y="530" font-size="14" font-family="Arial" text-anchor="middle" font-weight="bold">ASEPTIC</text>

  <!-- NURSES' STATION (Left) -->
  <rect x="200" y="500" width="80" height="80" fill="#FFEBEE" stroke="black" stroke-width="2" id="nurses_station_left"/>
  <text x="240" y="535" font-size="9" font-family="Arial" text-anchor="middle" font-weight="bold">NURSES'</text>
  <text x="240" y="550" font-size="9" font-family="Arial" text-anchor="middle" font-weight="bold">STATION</text>

  <!-- CLEAN CORRIDOR -->
  <rect x="410" y="470" width="160" height="80" fill="#FFFDE7" stroke="black" stroke-width="1" id="clean_corridor"/>
  <text x="490" y="510" font-size="11" font-family="Arial" text-anchor="middle" font-weight="bold">CLEAN</text>
  <text x="490" y="528" font-size="11" font-family="Arial" text-anchor="middle" font-weight="bold">CORRIDOR</text>

  <!-- ========================================== -->
  <!--  ROW 4: Bottom-left (y ~ 580-780)          -->
  <!-- ========================================== -->

  <!-- STORE -->
  <rect x="100" y="580" width="130" height="40" fill="#E8F5E9" stroke="black" stroke-width="2" id="store"/>
  <text x="165" y="605" font-size="14" font-family="Arial" text-anchor="middle" font-weight="bold">STORE</text>

  <!-- RECOVERY RM -->
  <rect x="100" y="620" width="230" height="160" fill="#E8F5E9" stroke="black" stroke-width="2" id="recovery_rm"/>
  <text x="215" y="710" font-size="13" font-family="Arial" text-anchor="middle" font-weight="bold">RECOVERY RM</text>

  <!-- PAEDIATRICS -->
  <rect x="370" y="580" width="200" height="100" fill="#E8F5E9" stroke="black" stroke-width="2" id="paediatrics"/>
  <text x="470" y="640" font-size="13" font-family="Arial" text-anchor="middle" font-weight="bold">PAEDIATRICS</text>

  <!-- WAITING -->
  <rect x="570" y="580" width="220" height="200" fill="#FFF9C4" stroke="black" stroke-width="2" id="waiting"/>
  <text x="680" y="690" font-size="16" font-family="Arial" text-anchor="middle" font-weight="bold">WAITING</text>

  <!-- ========================================== -->
  <!--  RIGHT SIDE: Large rooms                   -->
  <!-- ========================================== -->

  <!-- NURSES' STATION (Right) -->
  <rect x="1050" y="330" width="200" height="100" fill="#FFEBEE" stroke="black" stroke-width="2" id="nurses_station_right"/>
  <text x="1150" y="375" font-size="12" font-family="Arial" text-anchor="middle" font-weight="bold">NURSES'</text>
  <text x="1150" y="395" font-size="12" font-family="Arial" text-anchor="middle" font-weight="bold">STATION</text>

  <!-- FEMALE WARD (large room on the right) -->
  <rect x="790" y="430" width="480" height="370" fill="#BBDEFB" stroke="black" stroke-width="2" id="female_ward"/>
  <text x="1030" y="620" font-size="18" font-family="Arial" text-anchor="middle" font-weight="bold">FEMALE WARD</text>

</svg>
