<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital AI Agent</title>
    <!-- Leaflet.js CSS + JS (Preloaded for performance) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --chat-bg: #ffffff;
            --user-msg: #3b82f6;
            --ai-msg: #f1f5f9;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
        }
        .user-message {
            background-color: var(--user-msg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: var(--ai-msg);
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .input-area {
            padding: 20px;
            background: var(--chat-bg);
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        .loading {
            display: none;
            align-self: flex-start;
            color: #64748b;
            font-size: 0.9rem;
            font-style: italic;
        }
        
        /* Map Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .modal-header {
            padding: 15px 20px;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
        }
        .modal-close:hover {
            background: none;
            color: #e2e8f0;
        }
        .map-container {
            width: 100%;
            height: 60vh;
            min-height: 400px;
            background: #f1f5f9;
            will-change: transform; /* Performance hint */
        }
        .path-summary {
            padding: 15px 20px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            font-size: 0.95rem;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .show-path-btn {
            margin-top: 10px;
            background: #10b981;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
            padding: 8px 16px;
        }
        .show-path-btn:hover {
            background: #059669;
        }
        
        /* Animated path */
        .animated-path {
            stroke-dasharray: 10, 10;
            animation: dash 2s linear infinite;
        }
        @keyframes dash {
            to {
                stroke-dashoffset: -20;
            }
        }
    </style>
</head>
<body>
    <!-- Map Modal -->
    <div class="modal-overlay" id="navModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="navModalTitle">🗺️ Navigation Path</span>
                <button class="modal-close" onclick="closeNavModal()">&times;</button>
            </div>
            <div id="navMapDiv" class="map-container"></div>
            <div class="path-summary" id="navPathSummary">
                📍 Loading path...
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            🏥 Hospital AI Assistant
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message ai-message">
                Hello! I am the hospital navigation assistant. How can I help you find your way today?
            </div>
            <div class="loading" id="loadingIndicator">Typing...</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="e.g., Where is the X-ray department?" onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const userId = "user-" + Math.random().toString(36).substr(2, 9);
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const loadingIndicator = document.getElementById('loadingIndicator');

        // Leaflet Map state
        let navMap = null;
        let navLayerGroup = null;

        function closeNavModal() {
            document.getElementById('navModal').style.display = 'none';
        }

        async function fetchAndShowPath(source, destination) {
            const modal = document.getElementById('navModal');
            const summary = document.getElementById('navPathSummary');
            const title = document.getElementById('navModalTitle');
            
            modal.style.display = 'flex';
            summary.innerHTML = "⏳ Calculating shortest path...";
            title.innerText = `🗺️ Navigation`;

            try {
                // Fetch path from API
                const res = await fetch(`/navigation/path`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source, destination, floor: 1 })
                });

                if (!res.ok) {
                    const err = await res.json();
                    summary.innerHTML = `❌ Error: ${err.detail || 'Could not find path.'}`;
                    return;
                }

                const pathData = await res.json();
                
                // Initialize map if needed
                if (!navMap) {
                    navMap = L.map('navMapDiv', {
                        crs: L.CRS.Simple,
                        zoomSnap: 0.25,
                        zoomAnimation: true,
                        attributionControl: false
                    });
                    navLayerGroup = L.layerGroup().addTo(navMap);
                }

                navLayerGroup.clearLayers();

                // Image bounds based on actual image dimensions
                const bounds = [[0, 0], [pathData.image_height, pathData.image_width]];
                
                // Add floor plan image
                L.imageOverlay(pathData.background_image, bounds).addTo(navLayerGroup);
                navMap.fitBounds(bounds);

                // Draw path polyline (note: Leaflet expects [y, x] coords)
                const coords = pathData.path.map(wp => [pathData.image_height - wp.y, wp.x]);
                
                L.polyline(coords, {
                    color: '#3b82f6',
                    weight: 4,
                    className: 'animated-path'
                }).addTo(navLayerGroup);

                // Source marker (Green)
                const srcWp = pathData.path[0];
                L.circleMarker([pathData.image_height - srcWp.y, srcWp.x], {
                    radius: 8, color: '#22c55e', fillOpacity: 0.9
                }).addTo(navLayerGroup).bindPopup(`Start: ${srcWp.label}`);

                // Dest marker (Red)
                const destWp = pathData.path[pathData.path.length - 1];
                L.circleMarker([pathData.image_height - destWp.y, destWp.x], {
                    radius: 8, color: '#ef4444', fillOpacity: 0.9
                }).addTo(navLayerGroup).bindPopup(`Destination: ${destWp.label}`);

                // Update summary
                title.innerText = `🗺️ Floor ${pathData.floor_name}`;
                summary.innerHTML = `📍 ${srcWp.label} <span style="color:#94a3b8">→</span> ` +
                                    `<span style="color:#3b82f6">${pathData.path.length - 2} intermediate points</span> ` +
                                    `<span style="color:#94a3b8">→</span> ${destWp.label}`;

            } catch (err) {
                console.error(err);
                summary.innerHTML = `❌ Error rendering path.`;
            }
        }

        function appendMessage(text, isUser, intent = "", navHints = null) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            // Simple markdown-style line break replacement
            div.innerHTML = text.replace(/\n/g, '<br>');
            
            // If it's an AI message with navigation hints, add the button
            if (!isUser && intent === "NAVIGATION" && navHints && navHints.source && navHints.destination) {
                const btn = document.createElement('button');
                btn.className = 'show-path-btn';
                btn.innerHTML = '🗺️ Show Path on Map';
                btn.onclick = () => {
                    const params = new URLSearchParams({
                        source: navHints.source,
                        dest: navHints.destination
                    });
                    window.open(`/navigate?${params.toString()}`, '_blank');
                };
                
                const btnWrapper = document.createElement('div');
                btnWrapper.style.marginTop = '10px';
                btnWrapper.appendChild(btn);
                div.appendChild(btnWrapper);
            }

            chatBox.insertBefore(div, loadingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Clear input and show user message
            userInput.value = '';
            appendMessage(message, true);
            
            // Show loading state
            loadingIndicator.style.display = 'block';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        message: message
                    })
                });

                const data = await response.json();
                loadingIndicator.style.display = 'none';
                
                if (response.ok) {
                    appendMessage(data.response, false, data.intent, data.navigation_hints);
                } else {
                    appendMessage(`Error: ${data.detail || 'Something went wrong'}`, false);
                }
            } catch (error) {
                loadingIndicator.style.display = 'none';
                appendMessage('Error: Cannot connect to the server.', false);
            }
        }
    </script>
</body>
</html>
